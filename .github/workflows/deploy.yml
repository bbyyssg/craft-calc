name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # With public/CNAME the site is built for that custom domain at the root;
      # without it, for https://<owner>.github.io/<repo>/.
      - name: Build
        run: |
          if [ -f public/CNAME ]; then
            export SITE_URL="https://$(tr -d '[:space:]' < public/CNAME)"
          else
            export SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            export BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          fi
          echo "Building for $SITE_URL${BASE_PATH:-/}"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
